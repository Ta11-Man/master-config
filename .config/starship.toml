"$schema" = 'https://starship.rs/config-schema.json'

format = """
$custom\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$python\
$nodejs\
$cmd_duration\
$status\
$line_break\
$character"""

command_timeout = 50

# -----------------------------------------------------------------------------
# OS & Username Pill (Swedish Blue)
# -----------------------------------------------------------------------------
[os]
disabled = true

[custom.fast_os]
command = "cat /tmp/.os_glyph_$USER"
when = "test -f /tmp/.os_glyph_$USER"
style = "bg:#0057B7 fg:#FBD951 bold"
format = "[](fg:#0057B7)[$output ]($style)"

[username]
show_always = true
style_user = "bg:#0057B7 fg:#FBD951 bold"
style_root = "bg:#0057B7 fg:#FF5555 bold"
format = "[](fg:#0057B7)[ $user]($style)[](fg:#0057B7) "

# -----------------------------------------------------------------------------
# SSH Hostname Pill (Active only over SSH)
# -----------------------------------------------------------------------------
[hostname]
ssh_only = true
style = "bg:#3379C5 fg:#FFFFFF bold"
format = "[](fg:#3379C5)[$ssh_symbol$hostname]($style)[](fg:#3379C5) "
ssh_symbol = " "
trim_at = ".cs.purdue.edu"

# -----------------------------------------------------------------------------
# Directory Pill (Swedish Yellow)
# -----------------------------------------------------------------------------
[directory]
style = "bg:#FBD951 fg:#0057B7 bold"
format = "[](fg:#FBD951)[$path]($style)[](fg:#FBD951) "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "󱂵 ~"

# -----------------------------------------------------------------------------
# Git Pill (Swedish Blue)
# -----------------------------------------------------------------------------
[git_branch]
symbol = " "
style = "bg:#0057B7 fg:#FBD951 bold"
format = "[](fg:#0057B7)[$symbol$branch]($style)"

[git_status]
style = "bg:#0057B7 fg:#FBD951 bold"
format = "([ $all_status$ahead_behind]($style))[](fg:#0057B7) "
conflicted = "🏳 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = " "
stashed = " "
modified = " "
staged = " "
renamed = "󰑕 "
deleted = "󰍵 "

# -----------------------------------------------------------------------------
# Language Modules (Soft Blue)
# -----------------------------------------------------------------------------
[c]
symbol = " "
style = "bg:#3379C5 fg:#FFFFFF bold"
format = "[](fg:#3379C5)[$symbol($version)]($style)[](fg:#3379C5) "

[rust]
symbol = " "
style = "bg:#3379C5 fg:#FFFFFF bold"
format = "[](fg:#3379C5)[$symbol($version)]($style)[](fg:#3379C5) "

[python]
symbol = " "
style = "bg:#3379C5 fg:#FFFFFF bold"
format = "[](fg:#3379C5)[$symbol($version)]($style)[](fg:#3379C5) "

[nodejs]
symbol = " "
style = "bg:#3379C5 fg:#FFFFFF bold"
format = "[](fg:#3379C5)[$symbol($version)]($style)[](fg:#3379C5) "

# -----------------------------------------------------------------------------
# Duration & Status
# -----------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000
style = "bg:#3379C5 fg:#FBD951 bold"
format = "[](fg:#3379C5)[ $duration]($style)[](fg:#3379C5) "

[status]
disabled = false
style = "bg:#FF5555 fg:#FFFFFF bold"
format = "[](fg:#FF5555)[$symbol$status]($style)[](fg:#FF5555) "
symbol = "✘ "
map_symbol = true

# -----------------------------------------------------------------------------
# Prompt Line
# -----------------------------------------------------------------------------
[character]
success_symbol = "[➜](bold #FBD951)"
error_symbol = "[➜](bold #FF5555)"

[docker_context]
disabled = true

[package]
disabled = true