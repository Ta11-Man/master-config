# Enable true color support & mouse
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"
set -g mouse on
set -s escape-time 0
set -g focus-events on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Vim style copy controls
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ==============================================================================
# Swedish Palette (#0057B7 Blue, #FBD951 Yellow, #3379C5 Soft Blue)
# ==============================================================================

# Status Bar General
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#0057B7,fg=#FBD951"

# Pane Borders
set -g pane-border-style "fg=#3379C5"
set -g pane-active-border-style "fg=#FBD951"

# Command Line (:command mode) & Copy Mode Highlights
set -g message-style "bg=#FBD951,fg=#0057B7,bold"
set -g message-command-style "bg=#0057B7,fg=#FBD951"
set -g mode-style "bg=#FBD951,fg=#0057B7,bold"

# ------------------------------------------------------------------------------
# Dynamic Theme (Plain ASCII vs Rich Nerd Font)
# ------------------------------------------------------------------------------
%if "#{==:#{NERD_FONT},0}"
    # --- PLAIN ASCII FALLBACK (SSH / Lab Machines) ---
    set -g status-left-length 40
    set -g status-left "#[fg=#0057B7,bg=#FBD951,bold] [#S] #[fg=#FBD951,bg=#0057B7] #I:#P | "

    set -g window-status-format "#[fg=#FFFFFF,bg=#0057B7] #I:#W "
    set -g window-status-current-format "#[fg=#0057B7,bg=#FBD951,bold] [#I:#W] #[fg=#FBD951,bg=#0057B7]"

    set -g status-right-length 60
    set -g status-right "#[fg=#FFFFFF,bg=#0057B7]#h #[fg=#FBD951,bg=#0057B7]| #[fg=#FBD951,bg=#0057B7,bold]%H:%M "
%else
    # --- RICH NERD FONT THEME ---
    set -g status-left-length 40
    set -g status-left "#[fg=#FBD951,bg=#0057B7,bold] 󰣇 #S #[fg=#0057B7,bg=#FBD951]#[fg=#0057B7,bg=#FBD951,bold] #I:#P #[fg=#FBD951,bg=#0057B7] "

    set -g window-status-format "#[fg=#3379C5,bg=#0057B7] #I #[fg=#FBD951,bg=#0057B7]#W "
    set -g window-status-current-format "#[fg=#FBD951,bg=#0057B7]#[fg=#0057B7,bg=#FBD951,bold]#I:#W#[fg=#FBD951,bg=#0057B7]"

    set -g status-right-length 60
    set -g status-right "#[fg=#3379C5,bg=#0057B7]#[fg=#FFFFFF,bg=#3379C5] 󰒋 #h #[fg=#FBD951,bg=#3379C5]#[fg=#0057B7,bg=#FBD951,bold]  %H:%M #[fg=#FBD951,bg=#0057B7]"
%endif

# Keep TPM initialization at the absolute bottom
run '~/.tmux/plugins/tpm/tpm'